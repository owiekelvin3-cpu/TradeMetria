<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = localStorage.getItem("capitalai-theme") || localStorage.getItem("trademetria-theme");
        var theme = t === "light" ? "light" : "dark";
        document.documentElement.classList.add(theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#F4F3F3" : "#050202");
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="CapitalAI — Professional brokerage, wealth management, and trading for private and institutional investors." />
    <meta name="theme-color" content="#050202" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CapitalAI" />
    <meta name="application-name" content="CapitalAI" />
    <meta property="og:title" content="CapitalAI | Professional Brokerage & Wealth Management" />
    <meta property="og:description" content="Full-service securities brokerage with segregated custody, transparent reporting, and institutional-grade execution." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.capitalai.online" />
    <meta property="og:image" content="https://www.capitalai.online/icons/icon-512.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- Non-blocking font stylesheet (swap) — media=print trick is reliable on iOS Safari -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>CapitalAI | Professional Brokerage & Wealth Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
