<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="face" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#2A1810"/>
      <stop offset="55%" stop-color="#120A06"/>
      <stop offset="100%" stop-color="#060403"/>
    </radialGradient>
    <linearGradient id="outerRim" x1="96" y1="64" x2="416" y2="448">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="22%" stop-color="#8B5A2B"/>
      <stop offset="55%" stop-color="#3D2414"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </linearGradient>
    <linearGradient id="innerRim" x1="128" y1="96" x2="384" y2="416">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="100%" stop-color="#120804"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#E8942A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8942A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letter" x1="168" y1="128" x2="344" y2="384">
      <stop offset="0%" stop-color="#FFE8C8"/>
      <stop offset="28%" stop-color="#F4B04A"/>
      <stop offset="58%" stop-color="#C8741E"/>
      <stop offset="100%" stop-color="#7A4010"/>
    </linearGradient>
    <linearGradient id="letterShine" x1="160" y1="120" x2="280" y2="260">
      <stop offset="0%" stop-color="#FFF6E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF6E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="1" flood-color="#FFD9A0" flood-opacity="0.25"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#050202"/>

  <circle cx="256" cy="262" r="188" fill="#000000" opacity="0.35" filter="url(#softGlow)"/>

  <circle cx="256" cy="256" r="196" fill="url(#outerRim)"/>
  <circle cx="256" cy="256" r="182" fill="url(#innerRim)"/>
  <circle cx="256" cy="256" r="168" fill="url(#face)"/>
  <circle cx="256" cy="256" r="168" fill="url(#warmGlow)"/>

  <path d="M 92 256 A 164 164 0 0 1 420 256" stroke="#B8895A" stroke-width="6" fill="none" opacity="0.35"/>
  <path d="M 108 256 A 148 148 0 0 0 404 256" stroke="#000000" stroke-width="3" fill="none" opacity="0.25"/>

  <g filter="url(#letterShadow)">
    <path
      d="M 334 142
         C 286 118 214 118 166 142
         C 132 160 112 196 112 232
         C 112 268 132 304 166 322
         C 214 346 286 346 334 322
         L 312 286
         C 278 302 222 302 188 286
         C 164 274 150 254 150 232
         C 150 210 164 190 188 178
         C 222 162 278 162 312 178
         Z"
      fill="url(#letter)"
    />
    <path
      d="M 334 142
         C 286 118 214 118 166 142
         C 132 160 112 196 112 232
         C 112 268 132 304 166 322
         C 214 346 286 346 334 322
         L 312 286
         C 278 302 222 302 188 286
         C 164 274 150 254 150 232
         C 150 210 164 190 188 178
         C 222 162 278 162 312 178
         Z"
      fill="url(#letterShine)"
      opacity="0.42"
    />
  </g>

  <ellipse cx="188" cy="176" rx="28" ry="12" fill="#FFF8EE" opacity="0.18" transform="rotate(-28 188 176)"/>
</svg>
